    <script>
      try {
        const t = localStorage.getItem("mohar.theme")
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t
        const l = localStorage.getItem("mohar.lang")
        if (l === "hi") document.documentElement.lang = "hi"
      } catch {}
      if (/[?&](exam|tour)=/.test(location.search) || document.documentElement.lang === "hi") document.documentElement.classList.add("no-shell")
      // a page restored from cache after a deploy points at old bundles that are gone; reload once to get the new ones
      addEventListener("error", (e) => {
        const src = e.target && (e.target.src || e.target.href)
        if (!src || !/\/assets\//.test(src)) return
        try {
          if (sessionStorage.getItem("mohar.reloaded")) return
          sessionStorage.setItem("mohar.reloaded", "1")
        } catch {
          return
        }
        location.reload()
      }, true)
      addEventListener("load", () => setTimeout(() => { try { sessionStorage.removeItem("mohar.reloaded") } catch {} }, 5000))
    </script>
